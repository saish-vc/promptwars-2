services:
  # ── Reverse proxy ──────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  # ── Application backend (multi-worker) ─────────────────────
  backend:
    build: ./backend
    environment:
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:80}
      NIM_API_KEY: ${NIM_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # PostgreSQL
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://legiflow:legiflow@postgres:5432/legiflow}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # S3 / MinIO
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-legiflow}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      # Feature flags
      ENABLE_FALLBACK_MODE: ${ENABLE_FALLBACK_MODE:-false}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nv-embedqa-e5-v5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── ARQ background task worker ─────────────────────────────
  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NIM_API_KEY: ${NIM_API_KEY:-}
      NIM_BASE_URL: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-70b-versatile}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      POSTGRES_URL: ${POSTGRES_URL:-postgresql+asyncpg://legiflow:legiflow@postgres:5432/legiflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-legiflow}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-false}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nvidia/nv-embedqa-e5-v5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ───────────────────────────────────────────────
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:80}
    ports:
      - "5173:8000"
    depends_on:
      - backend
    restart: unless-stopped

  # ── PostgreSQL + pgvector ──────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legiflow
      POSTGRES_PASSWORD: legiflow
      POSTGRES_DB: legiflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legiflow -d legiflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis 7 ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
