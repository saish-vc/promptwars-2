services:
  - type: web
    name: legiflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: NIM_API_KEY
        sync: false
      - key: NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ENABLE_FALLBACK_MODE
        value: "true"
      - key: DATABASE_PATH
        value: /tmp/legiflow.db
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: CORS_ORIGINS
        sync: false
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: REDIS_URL
        value: ""
      - key: S3_ACCESS_KEY
        value: ""
      - key: S3_SECRET_KEY
        value: ""
